limit_req_zone $binary_remote_addr zone=dashboard_overview:10m rate=1r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/dashboard/overview {
        if ($request_method != GET) {
            return 405;
        }

        limit_req zone=dashboard_overview burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @dashboard_rate_limited;

        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000/dashboard/overview;
    }

    location @dashboard_rate_limited {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After "1" always;
        return 429 '{"detail":"dashboard request rate limit exceeded"}\n';
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /ws {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
